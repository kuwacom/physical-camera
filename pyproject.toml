[project]
name = "physical-camera"
version = "1.0.0"
description = "Blender の OSL カメラで実写的なレンズシミュレーションを行うアドオン"
readme = "README.md"
license = "GPL-3.0-or-later"
# エクステンションの対応下限である Blender 4.5 の同梱 Python が 3.11 のため、これより新しい構文は使わない
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.14",
    # scripts/build_diagrams.py がレンズ断面図の PNG を生成するのに使う
    "pillow",
]

# Blender のアドオンとして直接読み込むため、Python パッケージとしてはビルドしない
[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["src/lenses", "src/previews"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle の警告
    "F",   # pyflakes
    "I",   # import の並び順
    "UP",  # 新しい構文への書き換え
    "B",   # バグになりやすい書き方
]
# コードの行長は formatter が揃えるため、折り返せないコメントや埋め込みスクリプトの長さは許容する
ignore = ["E501"]

[tool.ruff.lint.isort]
# アドオン内の相対 import を外部パッケージと区別するため
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
